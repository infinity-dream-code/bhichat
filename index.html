<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BhiChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
:root {
  --bg: #050706;
  --panel: #0a0f0c;
  --panel-alt: #0d1310;
  --amber: #ffb703;
  --amber-dim: #8a6712;
  --cyan: #4dd8d0;
  --green: #5fd77c;
  --red: #ff5c5c;
  --text: #cbd6cd;
  --text-dim: #55625a;
  --border: rgba(203, 214, 205, 0.14);
  --border-bright: rgba(255, 183, 3, 0.4);
}
html,
body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  font-family: 'JetBrains Mono', monospace;
  color: var(--text);
  overflow: hidden;
  position: fixed;
  top: 0;
  left: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 3px);
  pointer-events: none;
  z-index: 5;
}
.stage {
  position: relative;
  z-index: 3;
  height: 100%;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
}
@keyframes riseIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.win {
  position: relative;
  width: 100%;
  max-width: 440px;
  background: linear-gradient(180deg, var(--panel), var(--panel-alt));
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
  animation: riseIn 0.35s ease;
  display: flex;
  flex-direction: column;
  max-height: 100%;
  overflow: hidden;
}
.corner {
  position: absolute;
  width: 14px;
  height: 14px;
  pointer-events: none;
  border-color: var(--border-bright);
}
.corner.tl {
  top: -1px;
  left: -1px;
  border-top: 2px solid;
  border-left: 2px solid;
  border-radius: 6px 0 0 0;
}
.corner.tr {
  top: -1px;
  right: -1px;
  border-top: 2px solid;
  border-right: 2px solid;
  border-radius: 0 6px 0 0;
}
.corner.bl {
  bottom: -1px;
  left: -1px;
  border-bottom: 2px solid;
  border-left: 2px solid;
  border-radius: 0 0 0 6px;
}
.corner.br {
  bottom: -1px;
  right: -1px;
  border-bottom: 2px solid;
  border-right: 2px solid;
  border-radius: 0 0 6px 0;
}
.titlebar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 34px;
}
.tlight {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.tlight.r {
  background: #ff5f57;
}
.tlight.y {
  background: #febc2e;
}
.tlight.g {
  background: #28c840;
}
.titletext {
  margin-left: 4px;
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.board-body {
  padding: 16px 14px 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow-y: auto;
}
.brand {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--amber);
  text-shadow: 0 0 16px rgba(255, 183, 3, 0.35);
  line-height: 1;
  margin-bottom: 14px;
}
.cursor-blink {
  display: inline-block;
  width: 7px;
  height: 16px;
  background: var(--amber);
  margin-left: 2px;
  vertical-align: -2px;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink {
  0%,
  49% {
    opacity: 1;
  }
  50%,
  100% {
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .cursor-blink {
    animation: none;
    opacity: 1;
  }
}
.field {
  margin-bottom: 10px;
}
.field label {
  display: block;
  font-size: 9px;
  color: var(--cyan);
  margin-bottom: 3px;
}
.field label::before {
  content: '$ ';
  color: var(--text-dim);
}
.field input {
  width: 100%;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 8px 10px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s ease;
  -webkit-appearance: none;
  appearance: none;
}
.field input:focus {
  border-color: var(--amber);
}
.field input::placeholder {
  color: var(--text-dim);
}
.field.err input {
  border-color: var(--red);
}
.btn {
  width: 100%;
  padding: 10px;
  margin-top: 4px;
  background: var(--amber);
  color: #1a1200;
  border: none;
  border-radius: 3px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: box-shadow 0.15s ease, transform 0.1s ease;
  touch-action: manipulation;
}
.btn:hover {
  box-shadow: 0 8px 22px rgba(255, 183, 3, 0.3);
}
.btn:active {
  transform: scale(0.98);
}
#chat-screen {
  display: none;
  width: 100%;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}
#chat-screen.active {
  display: flex;
  animation: riseIn 0.35s ease;
}
.chat-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  flex-shrink: 0;
  min-height: 36px;
}
.header-info {
  flex: 1;
  min-width: 0;
}
.room-tag {
  font-size: 13px;
  color: var(--amber);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.status {
  font-size: 8px;
  letter-spacing: 0.3px;
  margin-top: 1px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}
.status .off {
  color: var(--red);
}
.status .connecting {
  color: var(--amber-dim);
}
.status .live {
  color: var(--green);
}
.status .online-users {
  color: var(--text-dim);
  font-size: 7px;
}
.leave {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  padding: 4px 7px;
  border-radius: 3px;
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease;
  touch-action: manipulation;
  white-space: nowrap;
  flex-shrink: 0;
}
.leave:hover {
  border-color: var(--red);
  color: var(--red);
}
#messages {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  min-height: 30px;
  -webkit-overflow-scrolling: touch;
}
#messages::-webkit-scrollbar {
  width: 3px;
}
#messages::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}
.empty-state {
  margin: auto;
  text-align: center;
  color: var(--text-dim);
  font-size: 11px;
  line-height: 1.6;
}
.empty-state .glyph {
  color: var(--amber-dim);
  margin-bottom: 3px;
}
.row {
  display: flex;
  align-items: flex-start;
  gap: 5px;
  max-width: 98%;
}
.row.own {
  align-self: flex-end;
  flex-direction: row-reverse;
}
.avatar-photo {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #ffffff;
  overflow: hidden;
  border: 1.5px solid;
  margin-top: 1px;
}
.avatar-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
@keyframes writeIn {
  from {
    opacity: 0;
    transform: translateY(3px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.msg-col {
  animation: writeIn 0.2s ease;
  min-width: 0;
}
.who {
  font-size: 9px;
  margin-bottom: 1px;
  padding: 0 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row.own .who {
  text-align: right;
}
.bubble {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-left: 2px solid var(--amber-dim);
  border-radius: 3px;
  padding: 4px 7px;
  font-size: 12px;
  line-height: 1.4;
  word-wrap: break-word;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  max-width: 100%;
}
.bubble img {
  max-width: 100%;
  max-height: 140px;
  border-radius: 4px;
  margin-top: 3px;
  display: block;
  height: auto;
}
.row.own .bubble {
  border-left: none;
  border-right: 2px solid var(--cyan);
  background: rgba(77, 216, 208, 0.06);
}
.time {
  font-size: 8px;
  color: var(--text-dim);
  margin-top: 1px;
  padding: 0 2px;
  white-space: nowrap;
}
.row.own .time {
  text-align: right;
}
.logline {
  font-size: 10px;
  padding: 0 2px;
  word-break: break-word;
  opacity: 1;
  transition: opacity 0.5s ease;
}
.logline.fade-out {
  opacity: 0;
}
.logline.info {
  color: var(--text-dim);
}
.logline.join {
  color: var(--green);
}
.logline.leave {
  color: var(--red);
}
.logline.error {
  color: var(--red);
}
.composer {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 8px;
  flex-shrink: 0;
  flex-wrap: nowrap;
  min-height: 38px;
}
.prompt {
  color: var(--cyan);
  font-size: 12px;
  flex-shrink: 0;
}
.composer input[type="text"] {
  flex: 1;
  min-width: 40px;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  outline: none;
  padding: 4px 0;
  min-height: 26px;
}
.composer input[type="text"]::placeholder {
  color: var(--text-dim);
}
.composer button {
  background: none;
  border: 1px solid var(--border-bright);
  color: var(--amber);
  border-radius: 3px;
  padding: 4px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  font-size: 10px;
  cursor: pointer;
  transition: background 0.15s ease;
  touch-action: manipulation;
  white-space: nowrap;
  min-height: 26px;
}
.composer button:hover {
  background: rgba(255, 183, 3, 0.08);
}
.composer button:active {
  transform: scale(0.96);
}
.upload-wrap {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}
.upload-wrap input[type="file"] {
  display: none;
}
.upload-label {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
  touch-action: manipulation;
}
.upload-label:hover {
  border-color: var(--cyan);
  color: var(--cyan);
  background: rgba(77, 216, 208, 0.06);
}
.upload-label:active {
  transform: scale(0.92);
}
.upload-label svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
}
.upload-progress {
  display: none;
  width: 26px;
  height: 26px;
  border: 2px solid var(--border);
  border-top-color: var(--amber);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

  }
  .composer {
    padding: 2px 4px;
    min-height: 24px;
    gap: 2px;
  }
  .prompt {
    font-size: 9px;
  }
  .composer input[type="text"] {
    font-size: 11px;
    padding: 2px 0;
    min-height: 18px;
  }
  .composer button {
    font-size: 7px;
    padding: 2px 4px;
    min-height: 18px;
  }
  .upload-label {
    width: 18px;
    height: 18px;
  }
  .upload-label svg {
    width: 10px;
    height: 10px;
  }
  .upload-progress {
    width: 18px;
    height: 18px;
  }
}
</style>
</head>
<body>
<div class="stage">
  <div class="win" id="join-screen">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="titlebar">
      <span class="tlight r"></span><span class="tlight y"></span><span class="tlight g"></span>
      <span class="titletext">root@bhichat:~</span>
    </div>
    <div class="board-body">
      <div class="brand">BHICHAT<span class="cursor-blink"></span></div>
      <div class="field" id="room-field">
        <label>Channel</label>
        <input id="room-input" type="text" placeholder="markas-tim" maxlength="40" autocomplete="off">
      </div>
      <div class="field" id="name-field">
        <label>Name</label>
        <input id="name-input" type="text" placeholder="rizki" maxlength="24" autocomplete="off">
      </div>
      <button class="btn" id="join-btn">&gt; hubungkan</button>
    </div>
  </div>
  <div class="win" id="chat-screen">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="titlebar">
      <span class="tlight r"></span><span class="tlight y"></span><span class="tlight g"></span>
      <span class="titletext">root@bhichat:~</span>
    </div>
    <div class="chat-header">
      <div class="header-info">
        <div class="room-tag" id="room-label"></div>
        <div class="status">
          <span class="connecting" id="status-text">[connecting]</span>
          <span class="online-users" id="online-users"></span>
        </div>
      </div>
      <button class="leave" id="leave-btn">exit</button>
    </div>
    <div id="messages"></div>
    <div class="composer">
      <span class="prompt">$</span>
      <input id="msg-input" type="text" placeholder="tulis pesan..." maxlength="500" autocomplete="off">
      <div class="upload-wrap">
        <label for="file-upload" class="upload-label" id="upload-btn" title="Upload gambar">
          <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        </label>
        <div class="upload-progress" id="upload-spinner"></div>
        <input id="file-upload" type="file" accept="image/*">
      </div>
      <button id="send-btn">send</button>
    </div>
  </div>
</div>
<script>
(function() {
  var joinScreen = document.getElementById('join-screen');
  var chatScreen = document.getElementById('chat-screen');
  var roomField = document.getElementById('room-field');
  var nameField = document.getElementById('name-field');
  var roomInput = document.getElementById('room-input');
  var nameInput = document.getElementById('name-input');
  var joinBtn = document.getElementById('join-btn');
  var leaveBtn = document.getElementById('leave-btn');
  var roomLabel = document.getElementById('room-label');
  var statusText = document.getElementById('status-text');
  var onlineUsersEl = document.getElementById('online-users');
  var messagesEl = document.getElementById('messages');
  var msgInput = document.getElementById('msg-input');
  var sendBtn = document.getElementById('send-btn');
  var fileInput = document.getElementById('file-upload');
  var uploadBtn = document.getElementById('upload-btn');
  var uploadSpinner = document.getElementById('upload-spinner');
  var IMGBB_API_KEY = 'df097cb85677d1f445b36e6f030d068f';
  var IMGBB_URL = 'https://api.imgbb.com/1/upload';
  var lastUploadTime = 0;
  var tagColors = ['--amber', '--cyan', '--green', '--red'];
  var fadeTimeouts = {};
  var onlineUsers = {};
  var myName = '';
  var userLastSeen = {};
  var cleanupInterval = null;
  var cache = {
    get: function(k) { return sessionStorage.getItem('cachechat_' + k); },
    set: function(k, v) { sessionStorage.setItem('cachechat_' + k, v); }
  };
  var clientId = cache.get('cid');
  if (!clientId) {
    clientId = Math.random().toString(36).slice(2, 10);
    cache.set('cid', clientId);
  }
  roomInput.value = cache.get('room') || '';
  nameInput.value = cache.get('name') || '';
  var source = null;
  var currentTopic = null;
  var keepAliveInterval = null;

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' } [c];
    });
  }

  function slugify(s) {
    return s.toLowerCase().trim().replace(/[^a-z0-9-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  }

  function colorFor(name) {
    var sum = 0;
    for (var i = 0; i < name.length; i++) sum += name.charCodeAt(i);
    return tagColors[sum % tagColors.length];
  }

  function updateOnlineUsers() {
    var names = Object.keys(onlineUsers);
    var count = names.length;
    if (count === 0) {
      onlineUsersEl.textContent = '';
      return;
    }
    var display = '';
    if (count <= 3) {
      display = names.join(', ');
    } else {
      display = names.slice(0, 3).join(', ') + ' & ' + (count - 3) + ' lainnya';
    }
    onlineUsersEl.textContent = ' | ' + display;
  }

  function clearEmptyState() {
    var e = messagesEl.querySelector('.empty-state');
    if (e) e.remove();
  }

  function showEmptyState() {
    if (messagesEl.querySelector('.empty-state')) return;
    var el = document.createElement('div');
    el.className = 'empty-state';
    el.innerHTML = '<div class="glyph">[ // ]</div>belum ada log obrolan<br>ketik sesuatu buat mulai';
    messagesEl.appendChild(el);
  }

  function addLogLine(text, kind) {
    clearEmptyState();
    var sym = kind === 'join' ? '[+]' : kind === 'leave' ? '[-]' : kind === 'error' ? '[!]' : '[*]';
    var el = document.createElement('div');
    el.className = 'logline ' + kind;
    el.textContent = sym + ' ' + text;
    messagesEl.appendChild(el);
    scrollDown();
    if (kind === 'error' || kind === 'info') {
      var id = 'fade-' + Date.now() + '-' + Math.random();
      el.dataset.fadeId = id;
      if (fadeTimeouts[id]) clearTimeout(fadeTimeouts[id]);
      fadeTimeouts[id] = setTimeout(function() {
        el.classList.add('fade-out');
        setTimeout(function() {
          if (el.parentNode) el.remove();
          delete fadeTimeouts[id];
        }, 500);
      }, 5000);
    }
  }

  function addChatMessage(data) {
    clearEmptyState();
    var isOwn = data.c === clientId;
    var col = colorFor(data.u);
    var row = document.createElement('div');
    row.className = 'row' + (isOwn ? ' own' : '');
    var tag = document.createElement('div');
    tag.className = 'avatar-photo';
    tag.style.borderColor = 'var(' + col + ')';
    var tagImg = document.createElement('img');
    tagImg.src = 'https://c.top4top.io/p_3872w5pl31.png';
    tagImg.alt = data.u;
    tag.appendChild(tagImg);
    var msgCol = document.createElement('div');
    msgCol.className = 'msg-col';
    var who = document.createElement('div');
    who.className = 'who';
    who.style.color = 'var(' + col + ')';
    who.textContent = data.u;
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    var content = data.m;
    var isImageUrl = content.match(/^https?:\/\/.+\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?.*)?$/i);
    var isImgbbUrl = content.match(/^https?:\/\/i\.ibb\.co(\.com)?\/.+/i);
    if (isImageUrl || isImgbbUrl) {
      var url = content;
      if (isImgbbUrl && !url.includes('.com')) {
        url = url.replace('i.ibb.co', 'i.ibb.co.com');
      }
      var img = document.createElement('img');
      img.src = url;
      img.alt = 'gambar';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        var link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.textContent = '📷 ' + url;
        link.style.color = 'var(--cyan)';
        link.style.textDecoration = 'underline';
        link.style.wordBreak = 'break-all';
        bubble.appendChild(link);
      };
      bubble.appendChild(img);
    } else {
      bubble.innerHTML = escapeHtml(content);
    }
    var time = document.createElement('div');
    time.className = 'time';
    var d = new Date(data.t);
    time.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    msgCol.appendChild(who);
    msgCol.appendChild(bubble);
    msgCol.appendChild(time);
    row.appendChild(tag);
    row.appendChild(msgCol);
    messagesEl.appendChild(row);
    scrollDown();
  }

  function handleIncoming(data) {
    if (!data || !data.type) return;
    var now = Date.now();
    if (data.type === 'chat' && data.m && data.u) {
      addChatMessage(data);
      userLastSeen[data.u] = now;
      if (!onlineUsers[data.u] && data.u !== myName) {
        onlineUsers[data.u] = true;
        updateOnlineUsers();
        addLogLine(data.u + ' bergabung ke channel', 'join');
      }
    } else if (data.type === 'join' && data.u) {
      onlineUsers[data.u] = true;
      userLastSeen[data.u] = now;
      updateOnlineUsers();
      if (data.u !== myName) {
        addLogLine(data.u + ' bergabung ke channel', 'join');
      }
    } else if (data.type === 'leave' && data.u) {
      delete onlineUsers[data.u];
      delete userLastSeen[data.u];
      updateOnlineUsers();
      if (data.u !== myName) {
        addLogLine(data.u + ' keluar dari channel', 'leave');
      }
    } else if (data.type === 'ping' && data.u) {
      userLastSeen[data.u] = now;
      if (!onlineUsers[data.u] && data.u !== myName) {
        onlineUsers[data.u] = true;
        updateOnlineUsers();
        addLogLine(data.u + ' bergabung ke channel', 'join');
      }
    }
  }

  function scrollDown() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setStatus(state, label) {
    statusText.className = state;
    statusText.textContent = label;
  }

  function publish(topic, payload) {
    return fetch('https://ntfy.sh/' + topic, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
  }

  function sendKeepAlive() {
    if (currentTopic && myName) {
      publish(currentTopic, { type: 'ping', u: myName, t: Date.now(), c: clientId });
    }
  }

  function cleanupOfflineUsers() {
    var now = Date.now();
    var timeout = 60000;
    var changed = false;
    for (var name in userLastSeen) {
      if (name === myName) continue;
      if (now - userLastSeen[name] > timeout) {
        if (onlineUsers[name]) {
          delete onlineUsers[name];
          changed = true;
          addLogLine(name + ' keluar', 'leave');
        }
        delete userLastSeen[name];
      }
    }
    if (changed) {
      updateOnlineUsers();
    }
    userLastSeen[myName] = now;
  }

  function connect(room, name) {
    myName = name;
    onlineUsers = {};
    onlineUsers[name] = true;
    userLastSeen = {};
    userLastSeen[name] = Date.now();
    updateOnlineUsers();
    if (keepAliveInterval) {
      clearInterval(keepAliveInterval);
      keepAliveInterval = null;
    }
    if (cleanupInterval) {
      clearInterval(cleanupInterval);
      cleanupInterval = null;
    }
    var topic = 'cachechat-v1-' + slugify(room);
    currentTopic = topic;
    roomLabel.textContent = '#' + room;
    setStatus('connecting', '[connecting]');
    messagesEl.innerHTML = '';
    addLogLine('menghubungkan ke #' + room + '...', 'info');
    var joined = false;
    if (source) source.close();
    source = new EventSource('https://ntfy.sh/' + topic + '/sse');
    source.onopen = function() {
      setStatus('live', '[online]');
      if (!joined) {
        joined = true;
        publish(topic, { type: 'join', u: name, t: Date.now(), c: clientId });
        keepAliveInterval = setInterval(sendKeepAlive, 600000);
        cleanupInterval = setInterval(cleanupOfflineUsers, 15000);
      }
    };
    source.onerror = function() {
      setStatus('off', '[offline]');
      addLogLine('koneksi terputus, mencoba lagi...', 'error');
    };
    source.onmessage = function(evt) {
      try {
        var payload = JSON.parse(evt.data);
        if (payload.event !== 'message' || !payload.message) return;
        var data = JSON.parse(payload.message);
        handleIncoming(data);
      } catch (e) {}
    };
  }

  function sendMessage(text) {
    if (!currentTopic || !text.trim()) return;
    var payload = { type: 'chat', u: nameInput.value.trim(), m: text.trim(), t: Date.now(), c: clientId };
    publish(currentTopic, payload).catch(function() {
      addLogLine('gagal mengirim pesan', 'error');
    });
  }

  function showUploadProgress(show) {
    if (show) {
      uploadBtn.style.display = 'none';
      uploadSpinner.style.display = 'block';
    } else {
      uploadBtn.style.display = 'flex';
      uploadSpinner.style.display = 'none';
    }
  }

  function resizeImage(file, maxWidth, maxHeight, quality) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var width = img.width;
          var height = img.height;
          if (width > height) {
            if (width > maxWidth) {
              height = Math.round(height * (maxWidth / width));
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width = Math.round(width * (maxHeight / height));
              height = maxHeight;
            }
          }
          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob(function(blob) {
            if (!blob) {
              reject(new Error('Gagal mengompres gambar'));
              return;
            }
            resolve(blob);
          }, 'image/jpeg', quality);
        };
        img.onerror = function() {
          reject(new Error('Gagal memuat gambar'));
        };
        img.src = e.target.result;
      };
      reader.onerror = function() {
        reject(new Error('Gagal membaca file'));
      };
      reader.readAsDataURL(file);
    });
  }

  function uploadImage(file) {
    var currentName = nameInput.value.trim();
    if (!currentName.includes('X0')) {
      addLogLine('Anda Tidak Memiliki Akses', 'error');
      return;
    }
    var now = Date.now();
    if (now - lastUploadTime < 10000) {
      var wait = 10 - Math.floor((now - lastUploadTime) / 1000);
      addLogLine('tunggu ' + wait + ' detik', 'error');
      return;
    }
    resizeImage(file, 800, 800, 0.7).then(function(resizedBlob) {
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function(e) {
          resolve(e.target.result.split(',')[1]);
        };
        reader.onerror = reject;
        reader.readAsDataURL(resizedBlob);
      });
    }).then(function(base64) {
      var formData = new FormData();
      formData.append('key', IMGBB_API_KEY);
      formData.append('image', base64);
      showUploadProgress(true);
      return fetch(IMGBB_URL, {
        method: 'POST',
        body: formData
      });
    }).then(function(res) {
      if (!res.ok) {
        return res.json().then(function(errData) {
          throw new Error(errData.error?.message || 'Upload gagal');
        });
      }
      return res.json();
    }).then(function(data) {
      showUploadProgress(false);
      lastUploadTime = Date.now();
      if (data && data.data && data.data.url) {
        var imageUrl = data.data.url;
        if (imageUrl.includes('i.ibb.co') && !imageUrl.includes('.com')) {
          imageUrl = imageUrl.replace('i.ibb.co', 'i.ibb.co.com');
        }
        sendMessage(imageUrl);
      } else {
        throw new Error('Respons tidak valid');
      }
    }).catch(function(err) {
      showUploadProgress(false);
      addLogLine('gagal upload: ' + err.message, 'error');
      console.error('Upload error:', err);
    });
  }

  fileInput.addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
    if (!validTypes.includes(file.type)) {
      addLogLine('format tidak didukung (jpg, png, gif, webp)', 'error');
      fileInput.value = '';
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      addLogLine('ukuran terlalu besar (maks 5MB)', 'error');
      fileInput.value = '';
      return;
    }
    uploadImage(file);
    fileInput.value = '';
  });

  joinBtn.addEventListener('click', function() {
    var room = roomInput.value.trim();
    var name = nameInput.value.trim();
    roomField.classList.toggle('err', !room);
    nameField.classList.toggle('err', !name);
    if (!room || !name) return;
    cache.set('room', room);
    cache.set('name', name);
    joinScreen.style.display = 'none';
    chatScreen.classList.add('active');
    connect(room, name);
    msgInput.focus();
  });

  leaveBtn.addEventListener('click', function() {
    if (currentTopic) {
      publish(currentTopic, { type: 'leave', u: nameInput.value.trim(), t: Date.now(), c: clientId });
    }
    if (source) source.close();
    source = null;
    if (keepAliveInterval) {
      clearInterval(keepAliveInterval);
      keepAliveInterval = null;
    }
    if (cleanupInterval) {
      clearInterval(cleanupInterval);
      cleanupInterval = null;
    }
    currentTopic = null;
    onlineUsers = {};
    userLastSeen = {};
    updateOnlineUsers();
    chatScreen.classList.remove('active');
    joinScreen.style.display = 'block';
  });

  sendBtn.addEventListener('click', function() {
    sendMessage(msgInput.value);
    msgInput.value = '';
    msgInput.focus();
  });

  msgInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      sendMessage(msgInput.value);
      msgInput.value = '';
    }
  });

  roomInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') nameInput.focus();
  });
  nameInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') joinBtn.click();
  });

  document.addEventListener('touchstart', function() {}, { passive: true });
})();
</script>
</body>
