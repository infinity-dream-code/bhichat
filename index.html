<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BhiChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #050706;
  --panel: #0a0f0c;
  --panel-alt: #0d1310;
  --amber: #ffb703;
  --amber-dim: #8a6712;
  --cyan: #4dd8d0;
  --green: #5fd77c;
  --red: #ff5c5c;
  --text: #cbd6cd;
  --text-dim: #55625a;
  --border: rgba(203, 214, 205, 0.14);
  --border-bright: rgba(255, 183, 3, 0.4);
}
html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'JetBrains Mono', monospace;
  color: var(--text);
  overflow: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
  pointer-events: none;
  z-index: 5;
}
body::after {
  content: '';
  position: fixed;
  left: 0; right: 0;
  height: 120px;
  background: linear-gradient(180deg, transparent, rgba(255,183,3,0.045), transparent);
  animation: sweep 7s linear infinite;
  pointer-events: none;
  z-index: 4;
}
@keyframes sweep {
  0% { top: -120px; }
  100% { top: 100vh; }
}
@media (prefers-reduced-motion: reduce) {
  body::after { animation: none; display: none; }
}
.stage {
  position: relative;
  z-index: 3;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
@keyframes riseIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.win {
  position: relative;
  width: 100%;
  max-width: 440px;
  background: linear-gradient(180deg, var(--panel), var(--panel-alt));
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.6);
  animation: riseIn 0.35s ease;
}
.corner {
  position: absolute;
  width: 14px;
  height: 14px;
  pointer-events: none;
  border-color: var(--border-bright);
}
.corner.tl { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; border-radius: 6px 0 0 0; }
.corner.tr { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; border-radius: 0 6px 0 0; }
.corner.bl { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; border-radius: 0 0 0 6px; }
.corner.br { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; border-radius: 0 0 6px 0; }
.titlebar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.tlight { width: 10px; height: 10px; border-radius: 50%; }
.tlight.r { background: #ff5f57; }
.tlight.y { background: #febc2e; }
.tlight.g { background: #28c840; }
.titletext {
  margin-left: 6px;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.5px;
}
.board-body { padding: 26px 26px 28px; }
.brand {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--amber);
  text-shadow: 0 0 16px rgba(255, 183, 3, 0.35);
  margin-bottom: 4px;
}
.cursor-blink {
  display: inline-block;
  width: 9px;
  height: 20px;
  background: var(--amber);
  margin-left: 3px;
  vertical-align: -3px;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cursor-blink { animation: none; opacity: 1; } }
.tagline {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 26px;
  line-height: 1.6;
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 11px;
  color: var(--cyan);
  margin-bottom: 6px;
}
.field label::before { content: '$ '; color: var(--text-dim); }
.field input {
  width: 100%;
  background: rgba(0,0,0,0.35);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 11px 12px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13.5px;
  outline: none;
  transition: border-color 0.15s ease;
}
.field input:focus { border-color: var(--amber); }
.field input::placeholder { color: var(--text-dim); }
.field.err input { border-color: var(--red); }
.btn {
  width: 100%;
  padding: 13px;
  margin-top: 6px;
  background: var(--amber);
  color: #1a1200;
  border: none;
  border-radius: 3px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: box-shadow 0.15s ease, transform 0.1s ease;
}
.btn:hover { box-shadow: 0 8px 22px rgba(255, 183, 3, 0.3); }
.btn:active { transform: scale(0.98); }
#chat-screen {
  display: none;
  width: 100%;
  max-width: 460px;
  height: 88vh;
  max-height: 720px;
  flex-direction: column;
}
#chat-screen.active { display: flex; animation: riseIn 0.35s ease; }
.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
}
.room-tag { font-size: 15px; color: var(--amber); font-weight: 600; }
.status {
  font-size: 10.5px;
  letter-spacing: 0.5px;
  margin-top: 3px;
}
.status .off { color: var(--red); }
.status .connecting { color: var(--amber-dim); }
.status .live { color: var(--green); }
.leave {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  padding: 7px 11px;
  border-radius: 3px;
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease;
}
.leave:hover { border-color: var(--red); color: var(--red); }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
#messages::-webkit-scrollbar { width: 6px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.empty-state {
  margin: auto;
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.8;
}
.empty-state .glyph { color: var(--amber-dim); margin-bottom: 6px; }
.row {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  max-width: 84%;
}
.row.own { align-self: flex-end; flex-direction: row-reverse; }
.tag {
  flex-shrink: 0;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 5px;
  border-radius: 3px;
  border: 1px solid;
  margin-top: 1px;
}
@keyframes writeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
.msg-col { animation: writeIn 0.2s ease; }
.who { font-size: 10.5px; margin-bottom: 3px; padding: 0 2px; }
.row.own .who { text-align: right; }
.bubble {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-left: 2px solid var(--amber-dim);
  border-radius: 3px;
  padding: 8px 11px;
  font-size: 13px;
  line-height: 1.5;
  word-wrap: break-word;
  white-space: pre-wrap;
}
.row.own .bubble { border-left: none; border-right: 2px solid var(--cyan); background: rgba(77,216,208,0.06); }
.time { font-size: 9px; color: var(--text-dim); margin-top: 3px; padding: 0 2px; }
.row.own .time { text-align: right; }
.logline { font-size: 11px; padding: 0 2px; }
.logline.info { color: var(--text-dim); }
.logline.join { color: var(--green); }
.logline.leave { color: var(--red); }
.logline.error { color: var(--red); }
.composer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 13px 16px;
}
.prompt { color: var(--cyan); font-size: 13px; flex-shrink: 0; }
.composer input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13.5px;
  outline: none;
}
.composer input::placeholder { color: var(--text-dim); }
.composer button {
  background: none;
  border: 1px solid var(--border-bright);
  color: var(--amber);
  border-radius: 3px;
  padding: 7px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  font-size: 11.5px;
  cursor: pointer;
  transition: background 0.15s ease;
}
.composer button:hover { background: rgba(255,183,3,0.08); }
.composer button:active { transform: scale(0.96); }
@media (max-width: 500px) {
  .win, #chat-screen { max-width: 100%; }
  .stage { padding: 10px; }
}
</style>
</head>
<body>
<div class="stage">
  <div class="win" id="join-screen">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="titlebar">
      <span class="tlight r"></span><span class="tlight y"></span><span class="tlight g"></span>
      <span class="titletext">root@bhichat:~</span>
    </div>
    <div class="board-body">
      <div class="brand">BHICHAT<span class="cursor-blink"></span></div>
    
      <div class="field" id="room-field">
        <label>Channel</label>
        <input id="room-input" type="text" placeholder="markas-tim" maxlength="40">
      </div>
      <div class="field" id="name-field">
        <label>Name</label>
        <input id="name-input" type="text" placeholder="rizki" maxlength="24">
      </div>
      <button class="btn" id="join-btn">&gt; hubungkan</button>
    </div>
  </div>

  <div class="win" id="chat-screen">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="titlebar">
      <span class="tlight r"></span><span class="tlight y"></span><span class="tlight g"></span>
      <span class="titletext">root@bhichat:~</span>
    </div>
    <div class="chat-header">
      <div>
        <div class="room-tag" id="room-label"></div>
        <div class="status"><span class="connecting" id="status-text">[connecting]</span></div>
      </div>
      <button class="leave" id="leave-btn">exit</button>
    </div>
    <div id="messages"></div>
    <div class="composer">
      <span class="prompt">$</span>
      <input id="msg-input" type="text" placeholder="tulis pesan..." maxlength="500" autocomplete="off">
      <button id="send-btn">send</button>
    </div>
  </div>
</div>

<script>
(function () {
  var joinScreen = document.getElementById('join-screen');
  var chatScreen = document.getElementById('chat-screen');
  var roomField = document.getElementById('room-field');
  var nameField = document.getElementById('name-field');
  var roomInput = document.getElementById('room-input');
  var nameInput = document.getElementById('name-input');
  var joinBtn = document.getElementById('join-btn');
  var leaveBtn = document.getElementById('leave-btn');
  var roomLabel = document.getElementById('room-label');
  var statusText = document.getElementById('status-text');
  var messagesEl = document.getElementById('messages');
  var msgInput = document.getElementById('msg-input');
  var sendBtn = document.getElementById('send-btn');

  var tagColors = ['--amber', '--cyan', '--green', '--red'];

  var cache = {
    get: function (k) { return sessionStorage.getItem('cachechat_' + k); },
    set: function (k, v) { sessionStorage.setItem('cachechat_' + k, v); }
  };

  var clientId = cache.get('cid');
  if (!clientId) {
    clientId = Math.random().toString(36).slice(2, 10);
    cache.set('cid', clientId);
  }

  roomInput.value = cache.get('room') || '';
  nameInput.value = cache.get('name') || '';

  var source = null;
  var currentTopic = null;

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function slugify(s) {
    return s.toLowerCase().trim().replace(/[^a-z0-9-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  }

  function colorFor(name) {
    var sum = 0;
    for (var i = 0; i < name.length; i++) sum += name.charCodeAt(i);
    return tagColors[sum % tagColors.length];
  }

  function clearEmptyState() {
    var e = messagesEl.querySelector('.empty-state');
    if (e) e.remove();
  }

  function showEmptyState() {
    if (messagesEl.querySelector('.empty-state')) return;
    var el = document.createElement('div');
    el.className = 'empty-state';
    el.innerHTML = '<div class="glyph">[ // ]</div>belum ada log obrolan<br>ketik sesuatu buat mulai';
    messagesEl.appendChild(el);
  }

  function addLogLine(text, kind) {
    clearEmptyState();
    var sym = kind === 'join' ? '[+]' : kind === 'leave' ? '[-]' : kind === 'error' ? '[!]' : '[*]';
    var el = document.createElement('div');
    el.className = 'logline ' + kind;
    el.textContent = sym + ' ' + text;
    messagesEl.appendChild(el);
    scrollDown();
  }

  function addChatMessage(data) {
    clearEmptyState();
    var isOwn = data.c === clientId;
    var col = colorFor(data.u);

    var row = document.createElement('div');
    row.className = 'row' + (isOwn ? ' own' : '');

    var tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = data.u.slice(0, 2).toUpperCase();
    tag.style.color = 'var(' + col + ')';
    tag.style.borderColor = 'var(' + col + ')';

    var msgCol = document.createElement('div');
    msgCol.className = 'msg-col';

    var who = document.createElement('div');
    who.className = 'who';
    who.style.color = 'var(' + col + ')';
    who.textContent = data.u;

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = escapeHtml(data.m);

    var time = document.createElement('div');
    time.className = 'time';
    var d = new Date(data.t);
    time.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    msgCol.appendChild(who);
    msgCol.appendChild(bubble);
    msgCol.appendChild(time);
    row.appendChild(tag);
    row.appendChild(msgCol);
    messagesEl.appendChild(row);
    scrollDown();
  }

  function handleIncoming(data) {
    if (!data || !data.type) return;
    if (data.type === 'chat' && data.m && data.u) {
      addChatMessage(data);
    } else if (data.type === 'join' && data.u) {
      addLogLine(data.u + ' bergabung ke channel', 'join');
    } else if (data.type === 'leave' && data.u) {
      addLogLine(data.u + ' keluar dari channel', 'leave');
    }
  }

  function scrollDown() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setStatus(state, label) {
    statusText.className = state;
    statusText.textContent = label;
  }

  function publish(topic, payload) {
    return fetch('https://ntfy.sh/' + topic, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
  }

  function connect(room, name) {
    var topic = 'cachechat-v1-' + slugify(room);
    currentTopic = topic;
    roomLabel.textContent = '#' + room;
    setStatus('connecting', '[connecting]');
    messagesEl.innerHTML = '';
    addLogLine('menghubungkan ke #' + room + '...', 'info');

    var joined = false;

    if (source) source.close();
    source = new EventSource('https://ntfy.sh/' + topic + '/sse');

    source.onopen = function () {
      setStatus('live', '[online]');
      if (!joined) {
        joined = true;
        publish(topic, { type: 'join', u: name, t: Date.now(), c: clientId });
      }
    };

    source.onerror = function () {
      setStatus('off', '[offline]');
      addLogLine('koneksi terputus, mencoba lagi...', 'error');
    };

    source.onmessage = function (evt) {
      try {
        var payload = JSON.parse(evt.data);
        if (payload.event !== 'message' || !payload.message) return;
        var data = JSON.parse(payload.message);
        handleIncoming(data);
      } catch (e) {}
    };
  }

  function sendMessage(text) {
    if (!currentTopic || !text.trim()) return;
    var payload = { type: 'chat', u: nameInput.value.trim(), m: text.trim(), t: Date.now(), c: clientId };
    publish(currentTopic, payload).catch(function () {
      addLogLine('gagal mengirim pesan', 'error');
    });
  }

  joinBtn.addEventListener('click', function () {
    var room = roomInput.value.trim();
    var name = nameInput.value.trim();
    roomField.classList.toggle('err', !room);
    nameField.classList.toggle('err', !name);
    if (!room || !name) return;
    cache.set('room', room);
    cache.set('name', name);
    joinScreen.style.display = 'none';
    chatScreen.classList.add('active');
    connect(room, name);
    msgInput.focus();
  });

  leaveBtn.addEventListener('click', function () {
    if (currentTopic) {
      publish(currentTopic, { type: 'leave', u: nameInput.value.trim(), t: Date.now(), c: clientId });
    }
    if (source) source.close();
    source = null;
    currentTopic = null;
    chatScreen.classList.remove('active');
    joinScreen.style.display = 'block';
  });

  sendBtn.addEventListener('click', function () {
    sendMessage(msgInput.value);
    msgInput.value = '';
    msgInput.focus();
  });

  msgInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      sendMessage(msgInput.value);
      msgInput.value = '';
    }
  });

  roomInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') nameInput.focus();
  });
  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') joinBtn.click();
  });
})();
</script>
</body>
</html>
