<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BhiChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --slate: #2b3a34;
  --slate-deep: #212e29;
  --chalk: #e8e4d8;
  --chalk-dim: #a9b3ac;
  --chalk-yellow: #e8c468;
  --chalk-pink: #d98a8a;
  --chalk-blue: #8ab4d9;
  --chalk-mint: #8fd0b0;
  --chalk-lav: #b5a3d9;
  --line: rgba(232, 228, 216, 0.18);
}
html, body {
  height: 100%;
  background: var(--slate-deep);
  font-family: 'IBM Plex Mono', monospace;
  color: var(--chalk);
  overflow: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: 1;
}
.dust {
  position: fixed;
  top: -10px;
  width: 3px;
  height: 3px;
  background: var(--chalk);
  border-radius: 50%;
  opacity: 0;
  z-index: 2;
  animation: fall linear infinite;
}
@keyframes fall {
  0% { opacity: 0; transform: translateY(0) translateX(0); }
  10% { opacity: 0.4; }
  90% { opacity: 0.2; }
  100% { opacity: 0; transform: translateY(105vh) translateX(20px); }
}
.stage {
  position: relative;
  z-index: 3;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
@keyframes riseIn {
  from { opacity: 0; transform: translateY(14px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.board {
  width: 100%;
  max-width: 440px;
  border: 2px dashed var(--line);
  border-radius: 6px;
  background: linear-gradient(180deg, var(--slate), var(--slate-deep));
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 80px rgba(0,0,0,0.25);
  padding: 32px 30px;
  animation: riseIn 0.4s ease;
}
.title {
  font-family: 'Caveat', cursive;
  font-size: 48px;
  font-weight: 700;
  color: var(--chalk-yellow);
  text-shadow: 0 0 14px rgba(232, 196, 104, 0.28);
  line-height: 1;
  text-align: center;
  margin-bottom: 30px;
}
.field {
  margin-bottom: 18px;
}
.field label {
  display: block;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--chalk-dim);
  margin-bottom: 7px;
}
.field input {
  width: 100%;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 13px 14px;
  color: var(--chalk);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.field input:focus {
  border-color: var(--chalk-yellow);
  background: rgba(0,0,0,0.35);
}
.field input::placeholder { color: rgba(169,179,172,0.4); }
.field.err input { border-color: var(--chalk-pink); }
.btn {
  width: 100%;
  padding: 14px;
  margin-top: 6px;
  background: var(--chalk-yellow);
  color: #2b2312;
  border: none;
  border-radius: 4px;
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.15s ease;
}
.btn:hover { box-shadow: 0 8px 22px rgba(232, 196, 104, 0.32); }
.btn:active { transform: scale(0.98); }
#chat-screen {
  display: none;
  width: 100%;
  max-width: 460px;
  height: 88vh;
  max-height: 720px;
  border: 2px dashed var(--line);
  border-radius: 6px;
  background: linear-gradient(180deg, var(--slate), var(--slate-deep));
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  flex-direction: column;
  overflow: hidden;
}
#chat-screen.active {
  display: flex;
  animation: riseIn 0.4s ease;
}
.chat-header {
  padding: 16px 18px;
  border-bottom: 1px dashed var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.room-tag {
  font-family: 'Caveat', cursive;
  font-size: 27px;
  color: var(--chalk-yellow);
}
.status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: var(--chalk-dim);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #c9645d;
  transition: background 0.3s ease;
}
.dot.connecting {
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}
.dot.live {
  background: #8fbf8a;
  box-shadow: 0 0 8px rgba(143, 191, 138, 0.6);
  animation: none;
}
.leave {
  background: none;
  border: 1px solid var(--line);
  color: var(--chalk-dim);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 7px 11px;
  border-radius: 4px;
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease;
}
.leave:hover { border-color: var(--chalk-pink); color: var(--chalk-pink); }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
#messages::-webkit-scrollbar { width: 6px; }
#messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.empty-state {
  margin: auto;
  text-align: center;
  color: var(--chalk-dim);
  font-size: 12px;
  line-height: 1.7;
  opacity: 0.7;
}
.empty-state .glyph {
  font-size: 26px;
  margin-bottom: 8px;
  opacity: 0.5;
}
.row {
  display: flex;
  align-items: flex-end;
  gap: 9px;
  max-width: 82%;
}
.row.own {
  align-self: flex-end;
  flex-direction: row-reverse;
}
.avatar {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: #17211d;
}
@keyframes chalkwrite {
  from { opacity: 0; transform: translateY(4px); filter: blur(2px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
.msg-col { animation: chalkwrite 0.25s ease; }
.msg .who {
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--chalk-blue);
  margin-bottom: 3px;
  padding: 0 2px;
}
.row.own .who { color: var(--chalk-yellow); text-align: right; }
.bubble {
  background: rgba(0,0,0,0.22);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 9px 12px;
  font-size: 13.5px;
  line-height: 1.5;
  word-wrap: break-word;
  white-space: pre-wrap;
}
.row.own .bubble {
  background: rgba(232, 196, 104, 0.1);
  border-color: rgba(232, 196, 104, 0.3);
}
.time {
  font-size: 9px;
  color: var(--chalk-dim);
  margin-top: 3px;
  padding: 0 2px;
}
.row.own .time { text-align: right; }
.system {
  align-self: center;
  font-size: 11px;
  color: var(--chalk-dim);
  font-style: italic;
}
.composer {
  display: flex;
  gap: 8px;
  padding: 14px;
  border-top: 1px dashed var(--line);
}
.composer input {
  flex: 1;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 11px 13px;
  color: var(--chalk);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13.5px;
  outline: none;
  transition: border-color 0.15s ease;
}
.composer input:focus { border-color: var(--chalk-yellow); }
.composer button {
  background: var(--chalk-yellow);
  color: #2b2312;
  border: none;
  border-radius: 4px;
  padding: 0 20px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: transform 0.1s ease;
}
.composer button:active { transform: scale(0.96); }
@media (max-width: 500px) {
  .board, #chat-screen { max-width: 100%; }
  .stage { padding: 10px; }
}
</style>
</head>
<body>
<div class="stage">
  <div class="board" id="join-screen">
    <div class="title">BhiChat</div>
    <div class="field" id="room-field">
      <label>Kode ruangan</label>
      <input id="room-input" type="text" placeholder="bhitech" maxlength="40">
    </div>
    <div class="field" id="name-field">
      <label>Nama panggilan</label>
      <input id="name-input" type="text" placeholder="misal: rizki" maxlength="24">
    </div>
    <button class="btn" id="join-btn">Masuk ruangan</button>
  </div>

  <div id="chat-screen">
    <div class="chat-header">
      <div>
        <div class="room-tag" id="room-label"></div>
        <div class="status"><span class="dot connecting" id="status-dot"></span><span id="status-text">connecting</span></div>
      </div>
      <button class="leave" id="leave-btn">Keluar</button>
    </div>
    <div id="messages"></div>
    <div class="composer">
      <input id="msg-input" type="text" placeholder="tulis pesan..." maxlength="500" autocomplete="off">
      <button id="send-btn">Kirim</button>
    </div>
  </div>
</div>

<script>
(function () {
  var dustLayer = document.body;
  for (var i = 0; i < 14; i++) {
    var d = document.createElement('div');
    d.className = 'dust';
    d.style.left = (Math.random() * 100) + 'vw';
    d.style.animationDuration = (8 + Math.random() * 10) + 's';
    d.style.animationDelay = (Math.random() * 10) + 's';
    dustLayer.appendChild(d);
  }

  var joinScreen = document.getElementById('join-screen');
  var chatScreen = document.getElementById('chat-screen');
  var roomField = document.getElementById('room-field');
  var nameField = document.getElementById('name-field');
  var roomInput = document.getElementById('room-input');
  var nameInput = document.getElementById('name-input');
  var joinBtn = document.getElementById('join-btn');
  var leaveBtn = document.getElementById('leave-btn');
  var roomLabel = document.getElementById('room-label');
  var statusDot = document.getElementById('status-dot');
  var statusText = document.getElementById('status-text');
  var messagesEl = document.getElementById('messages');
  var msgInput = document.getElementById('msg-input');
  var sendBtn = document.getElementById('send-btn');

  var avatarColors = ['--chalk-yellow', '--chalk-blue', '--chalk-mint', '--chalk-lav', '--chalk-pink'];

  var cache = {
    get: function (k) { return sessionStorage.getItem('cachechat_' + k); },
    set: function (k, v) { sessionStorage.setItem('cachechat_' + k, v); }
  };

  var clientId = cache.get('cid');
  if (!clientId) {
    clientId = Math.random().toString(36).slice(2, 10);
    cache.set('cid', clientId);
  }

  roomInput.value = cache.get('room') || '';
  nameInput.value = cache.get('name') || '';

  var source = null;
  var currentTopic = null;

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function slugify(s) {
    return s.toLowerCase().trim().replace(/[^a-z0-9-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  }

  function colorFor(name) {
    var sum = 0;
    for (var i = 0; i < name.length; i++) sum += name.charCodeAt(i);
    return avatarColors[sum % avatarColors.length];
  }

  function clearEmptyState() {
    var e = messagesEl.querySelector('.empty-state');
    if (e) e.remove();
  }

  function showEmptyState() {
    if (messagesEl.querySelector('.empty-state')) return;
    var el = document.createElement('div');
    el.className = 'empty-state';
    el.innerHTML = '<div class="glyph">&#9670;</div>belum ada obrolan<br>tulis sesuatu buat mulai';
    messagesEl.appendChild(el);
  }

  function addSystemLine(text) {
    clearEmptyState();
    var el = document.createElement('div');
    el.className = 'system';
    el.textContent = text;
    messagesEl.appendChild(el);
    scrollDown();
  }

  function addMessage(data) {
    clearEmptyState();
    var isOwn = data.c === clientId;

    var row = document.createElement('div');
    row.className = 'row' + (isOwn ? ' own' : '');

    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = data.u.charAt(0).toUpperCase();
    avatar.style.background = 'var(' + colorFor(data.u) + ')';

    var col = document.createElement('div');
    col.className = 'msg-col';

    var who = document.createElement('div');
    who.className = 'who';
    who.textContent = data.u;

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = escapeHtml(data.m);

    var time = document.createElement('div');
    time.className = 'time';
    var d = new Date(data.t);
    time.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    col.appendChild(who);
    col.appendChild(bubble);
    col.appendChild(time);
    row.appendChild(avatar);
    row.appendChild(col);
    messagesEl.appendChild(row);
    scrollDown();
  }

  function scrollDown() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setStatus(state, label) {
    statusDot.classList.remove('live', 'connecting');
    if (state === 'live') statusDot.classList.add('live');
    if (state === 'connecting') statusDot.classList.add('connecting');
    statusText.textContent = label;
  }

  function connect(room, name) {
    var topic = 'cachechat-v1-' + slugify(room);
    currentTopic = topic;
    roomLabel.textContent = '#' + room;
    setStatus('connecting', 'connecting');
    messagesEl.innerHTML = '';
    showEmptyState();

    var joined = false;

    if (source) source.close();
    source = new EventSource('https://ntfy.sh/' + topic + '/sse');

    source.onopen = function () {
      setStatus('live', 'live');
      if (!joined) {
        joined = true;
        addSystemLine(name + ' bergabung ke ruangan');
      }
    };

    source.onerror = function () {
      setStatus('off', 'terputus, mencoba lagi');
    };

    source.onmessage = function (evt) {
      try {
        var payload = JSON.parse(evt.data);
        if (payload.event !== 'message' || !payload.message) return;
        var data = JSON.parse(payload.message);
        if (!data || !data.m || !data.u) return;
        addMessage(data);
      } catch (e) {}
    };
  }

  function sendMessage(text) {
    if (!currentTopic || !text.trim()) return;
    var payload = { u: nameInput.value.trim(), m: text.trim(), t: Date.now(), c: clientId };
    fetch('https://ntfy.sh/' + currentTopic, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    }).catch(function () {
      addSystemLine('gagal mengirim, cek koneksi internet');
    });
  }

  joinBtn.addEventListener('click', function () {
    var room = roomInput.value.trim();
    var name = nameInput.value.trim();
    roomField.classList.toggle('err', !room);
    nameField.classList.toggle('err', !name);
    if (!room || !name) return;
    cache.set('room', room);
    cache.set('name', name);
    joinScreen.style.display = 'none';
    chatScreen.classList.add('active');
    connect(room, name);
    msgInput.focus();
  });

  leaveBtn.addEventListener('click', function () {
    if (source) source.close();
    source = null;
    currentTopic = null;
    chatScreen.classList.remove('active');
    joinScreen.style.display = 'block';
  });

  sendBtn.addEventListener('click', function () {
    sendMessage(msgInput.value);
    msgInput.value = '';
    msgInput.focus();
  });

  msgInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      sendMessage(msgInput.value);
      msgInput.value = '';
    }
  });

  roomInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') nameInput.focus();
  });
  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') joinBtn.click();
  });
})();
</script>
</body>
</html>
